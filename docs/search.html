</main><script type="application/json" id="scbp-legacy-search-config">{"base": "/single-cell-best-practices-zh", "routes": ["/", "/acknowledgements", "/air-repertoire/clonotype", "/air-repertoire/ir-profiling", "/air-repertoire/multimodal-integration", "/air-repertoire/specificity", "/cellular-structure/annotation", "/cellular-structure/clustering", "/cellular-structure/integration", "/changelog", "/chromatin-accessibility/gene-regulatory-networks-atac", "/chromatin-accessibility/introduction", "/chromatin-accessibility/quality-control", "/conditions/compositional", "/conditions/differential-gene-expression", "/conditions/gsea-pathway", "/conditions/perturbation-modeling", "/deconvolution/bulk-deconvolution", "/glossary", "/introduction/advanced-data-structures-and-frameworks", "/introduction/fundamental-data-structures-and-frameworks", "/introduction/interoperability", "/introduction/prior-art", "/introduction/rapids-singlecell", "/introduction/raw-data-processing", "/introduction/scrna-seq", "/mechanisms/cell-cell-communication", "/mechanisms/gene-regulatory-networks", "/multimodal-integration/advanced-integration", "/multimodal-integration/paired-integration", "/outlook", "/preprocessing-visualization/dimensionality-reduction", "/preprocessing-visualization/feature-selection", "/preprocessing-visualization/normalization", "/preprocessing-visualization/quality-control", "/spatial/deconvolution", "/spatial/domains", "/spatial/imputation", "/spatial/introduction", "/spatial/neighborhood", "/spatial/spatially-variable-genes", "/surface-protein/annotation", "/surface-protein/batch-correction", "/surface-protein/dimensionality-reduction", "/surface-protein/doublet-detection", "/surface-protein/normalization", "/surface-protein/quality-control", "/trajectories/lineage-tracing", "/trajectories/pseudotemporal", "/trajectories/rna-velocity"]}</script>
<script id="scbp-legacy-search">"use strict";

function scbpSearchText(value) {
  return String(value || "").normalize("NFKC").toLowerCase().replace(/\s+/g, " ").trim();
}

function scbpSearchRecords(records, query, base, routes) {
  const phrase = scbpSearchText(query);
  if (!phrase) return [];
  const terms = phrase.split(" ");
  const allowed = new Set(routes);
  const matches = new Map();
  for (const record of records) {
    if (typeof record.url !== "string" || !record.url.startsWith("/") ||
        record.url.startsWith("//") || record.url.includes("\\")) continue;
    const url = new URL(record.url, "https://scbp-search.invalid");
    const route = url.pathname.replace(/\/+$/, "") || "/";
    if (!allowed.has(route)) continue;
    const hierarchy = record.hierarchy || {};
    const labels = Object.keys(hierarchy).filter(key => /^lvl\d+$/.test(key))
      .sort((a, b) => Number(a.slice(3)) - Number(b.slice(3)))
      .map(key => String(hierarchy[key] || "")).filter(Boolean);
    const title = labels.join(" › ");
    const content = typeof record.content === "string" ? record.content : "";
    const heading = scbpSearchText(title);
    const text = scbpSearchText(title + " " + content);
    if (!terms.every(term => text.includes(term))) continue;
    const score = (heading === phrase ? 100 : heading.includes(phrase) ? 40 : 0) +
      terms.filter(term => heading.includes(term)).length * 10 + (content ? 1 : 0);
    const href = base + (route === "/" ? "/" : route + "/") + url.hash;
    const previous = matches.get(href);
    if (!previous || score > previous.score) matches.set(href, {title, content, href, score});
  }
  return [...matches.values()].sort((a, b) => b.score - a.score);
}

function scbpSearchSnippet(content, query) {
  const term = scbpSearchText(query).split(" ")[0];
  const position = content.toLowerCase().indexOf(term);
  const start = Math.max(0, position - 55);
  const end = Math.min(content.length, start + 180);
  return (start ? "…" : "") + content.slice(start, end) + (end < content.length ? "…" : "");
}

async function scbpStartSearch() {
  const config = JSON.parse(document.getElementById("scbp-legacy-search-config").textContent);
  const input = document.getElementById("search-query");
  const status = document.getElementById("search-status");
  const results = document.getElementById("search-results");
  const query = new URLSearchParams(window.location.search).get("q") || "";
  input.value = query;
  if (!query.trim()) return;
  status.textContent = "正在搜索…";
  try {
    const response = await fetch(config.base + "/myst.search.json");
    if (!response.ok) throw new Error("Search index unavailable");
    const index = await response.json();
    if (!Array.isArray(index.records)) throw new Error("Invalid search index");
    const matches = scbpSearchRecords(index.records, query, config.base, config.routes);
    for (const match of matches.slice(0, 60)) {
      const item = document.createElement("li");
      const link = document.createElement("a");
      link.href = match.href;
      link.textContent = match.title;
      item.appendChild(link);
      if (match.content) {
        const excerpt = document.createElement("p");
        excerpt.textContent = scbpSearchSnippet(match.content, query);
        item.appendChild(excerpt);
      }
      results.appendChild(item);
    }
    status.textContent = matches.length
      ? `找到 ${matches.length} 处匹配${matches.length > 60 ? "，显示前 60 处" : ""}。`
      : "没有找到匹配内容。可以尝试英文缩写，或缩短搜索词。";
  } catch (error) {
    status.textContent = "暂时无法加载搜索内容，请刷新重试，或从目录查找章节。";
  }
}

if (typeof document !== "undefined") scbpStartSearch();
</script></body></html>
